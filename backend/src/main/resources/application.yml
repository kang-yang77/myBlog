server:
  port: 8081

spring:
  application:
    name: blog-backend
  datasource:
    url: jdbc:h2:file:./data/blogdb;MODE=MySQL;AUTO_SERVER=TRUE;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

blog:
  storage:
    location: ./uploads
    public-path: /uploads
